; DXShop 部署目标清单
; 默认只部署到运行 Jenkins 的这台机器本身（localhost）。
; 若需部署到局域网其它机器，在 [dxshop] 下新增主机并配置 SSH 免密，
; 同时需把 Jenkins 构建的镜像推送到镜像仓库（并让 compose 引用仓库地址）。

[dxshop]
localhost ansible_connection=local

; 示例：部署到另一台 LAN 机器
; 需先在 Jenkins 机器执行：ssh-copy-id ubuntu@192.168.1.20
; 且 Jenkins 构建阶段要把镜像 push 到仓库、docker-compose.yml 引用仓库地址。
; 192.168.1.20 ansible_user=ubuntu
