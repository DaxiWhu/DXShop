name: CI

# 触发条件：向主分支推送或提 PR 时运行
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: {}   # 允许在 GitHub 页面手动触发

# 同一分支的新提交自动取消上一次仍在跑的流水线，节省额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: 构建与测试（单元 + 集成 / Testcontainers 容器模式）
    runs-on: ubuntu-latest   # GitHub 托管 runner 自带 Docker，Testcontainers 可直接用

    env:
      # 强制走真实容器模式：CI 连不上共享开发机，由 Testcontainers 拉起 MySQL / Redis
      DXSHOP_TEST_BACKEND: container
      # Testcontainers 在 CI 中的稳健性设置
      TESTCONTAINERS_RYUK_DISABLED: "true"

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven   # 自动缓存 ~/.m2，加速后续构建

      - name: 校验 Docker 可用
        run: docker info

      - name: 赋予 Maven Wrapper 执行权限
        run: chmod +x ./mvnw

      # verify 会依次触发 Surefire(单元测试 *Test) 与 Failsafe(集成测试 *IT)
      # -Ddxshop.test.backend=container 让 TestProfileResolver 选择 testcontainers profile
      - name: 运行测试（mvn verify，容器模式）
        run: ./mvnw -B -ntp verify -Ddxshop.test.backend=container

      - name: 上传测试报告（无论成败）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          if-no-files-found: ignore
          retention-days: 7
