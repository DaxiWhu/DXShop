name: CD

# 触发:CI 工作流在 master 上成功完成后自动跑;也支持手动触发。
on:
  # 关键：CD 只在 CI 工作流【成功完成】后才自动触发，不会与 CI 并行。
  # workflow_run 的 completed 事件本就在 CI 结束(无论成败)后发出；
  # build-and-push / deploy 的 if 再二次检查 conclusion == 'success'，
  # 因此 CI 没跑完、或跑失败了，CD 都不会真正构建/部署。
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]   # 仅 master 上的 CI 成功才触发，避免 PR/其它分支误触发
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    # 手动触发始终跑;workflow_run 触发时仅当 CI 成功且分支为 master 才跑。
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: 赋予 Maven Wrapper 执行权限
        run: chmod +x ./mvnw

      - name: Build all service jars
        run: ./mvnw -B package -DskipTests

      - name: Lowercase registry owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push dxshop-user
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.user
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ env.OWNER }}/dxshop-user:latest
            ghcr.io/${{ env.OWNER }}/dxshop-user:sha-${{ github.sha }}

      - name: Build & push dxshop-order
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.order
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ env.OWNER }}/dxshop-order:latest
            ghcr.io/${{ env.OWNER }}/dxshop-order:sha-${{ github.sha }}

      - name: Build & push dxshop-goods
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.goods
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ env.OWNER }}/dxshop-goods:latest
            ghcr.io/${{ env.OWNER }}/dxshop-goods:sha-${{ github.sha }}

      - name: Build & push dxshop-chat
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.chat
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ env.OWNER }}/dxshop-chat:latest
            ghcr.io/${{ env.OWNER }}/dxshop-chat:sha-${{ github.sha }}

  deploy:
    name: Deploy to single Linux server
    needs: build-and-push
    # 与 build-and-push 相同门槛：手动触发始终跑；workflow_run 仅在 CI 成功且 master 时跑。
    # 注意：GitHub Actions 不允许在 job 级 if 里使用 secrets 上下文，故“是否配置密钥”的判断
    # 改放在下方 step 内部（见 secret-check），此处只保留触发条件判断。
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # job 级 if 不能使用 secrets 上下文，故在此 step 内判断密钥是否已配置。
      # 通过 env 注入密钥(不直接打印到脚本日志)；为空则跳过后续部署步骤，CD 整体标绿。
      - name: Check deploy secrets configured
        id: secret-check
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::DEPLOY_SSH_KEY 未配置，跳过部署步骤（仅构建并推送镜像到 GHCR）。"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Copy compose file and deploy assets to server
        if: steps.secret-check.outputs.skip != 'true'
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          # deploy/ 下含 seata 配置与 push 脚本、mysql 初始化 SQL，compose 会挂载它们，必须一并上传
          source: "docker-compose.yml,deploy/**"
          target: "/opt/dxshop"

      - name: Pull images and run via docker compose
        if: steps.secret-check.outputs.skip != 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          script: |
            cd /opt/dxshop
            docker compose pull
            docker compose up -d
            docker image prune -f
