name: CD

# 触发:CI 工作流在 master 上成功完成后自动跑;也支持手动触发。
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    # 手动触发始终跑;workflow_run 触发时仅当 CI 成功且分支为 master 才跑。
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: 赋予 Maven Wrapper 执行权限
        run: chmod +x ./mvnw

      - name: Build all service jars
        run: ./mvnw -B package -DskipTests

      - name: Lowercase registry owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push dxshop-user
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.user
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ env.OWNER }}/dxshop-user:latest
            ghcr.io/${{ env.OWNER }}/dxshop-user:sha-${{ github.sha }}

      - name: Build & push dxshop-order
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.order
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ env.OWNER }}/dxshop-order:latest
            ghcr.io/${{ env.OWNER }}/dxshop-order:sha-${{ github.sha }}

      - name: Build & push dxshop-goods
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.goods
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ env.OWNER }}/dxshop-goods:latest
            ghcr.io/${{ env.OWNER }}/dxshop-goods:sha-${{ github.sha }}

      - name: Build & push dxshop-chat
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.chat
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ env.OWNER }}/dxshop-chat:latest
            ghcr.io/${{ env.OWNER }}/dxshop-chat:sha-${{ github.sha }}

  deploy:
    name: Deploy to single Linux server
    needs: build-and-push
    # 与 build-and-push 相同门槛：手动触发始终跑；workflow_run 仅在 CI 成功且 master 时跑
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy compose file to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          source: "docker-compose.yml"
          target: "/opt/dxshop"

      - name: Pull images and run via docker compose
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          script: |
            cd /opt/dxshop
            docker compose pull
            docker compose up -d
            docker image prune -f
