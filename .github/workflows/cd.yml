name: CD

# 触发: CI 在 master 上成功完成后自动跑; 也支持手动触发。
on:
  # CD 只在 CI 工作流【成功完成】后才自动触发，不会与 CI 并行。
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]   # 仅 master 上的 CI 成功才触发，避免 PR/其它分支误触发
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: 本机构建并部署 (self-hosted runner，不依赖 GHCR)
    # 手动触发始终跑; workflow_run 触发时仅当 CI 成功且分支为 master 才跑。
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'master')
    # 关键：部署 job 跑在【你内网里自建的 self-hosted runner】上（即目标机本身）。
    # 镜像在本机用 docker build 直接产出，不推送、也不从 ghcr.io 拉取，
    # 彻底绕开国内连 ghcr.io(微软网段) 超时的问题。
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up JDK 25
        # 在 self-hosted runner 上首次会下载并缓存 Temurin 25（下载源走 GitHub，可达）。
        # 若你的 runner 已装好 JDK25，此步可跳过；构建用的是 PATH 里的 java。
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: 赋予 Maven Wrapper 执行权限
        run: chmod +x ./mvnw

      - name: Build all service jars (Maven 依赖走阿里云镜像)
        # 4 个后端 jar 在本机打出，供下方 docker build COPY 使用。
        run: ./mvnw -B -ntp package -DskipTests -s .github/maven-settings.xml

      - name: Lowercase registry owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: 本机构建镜像 (不推送 GHCR)
        # 直接打成与 compose 同名的 ghcr.io/<owner>/dxshop-* 标签，
        # 这样 compose up 时本地已存在该镜像，pull_policy: missing 不会去 ghcr 拉取。
        run: |
          set -e
          for svc in user order goods chat; do
            docker build -t "ghcr.io/${OWNER}/dxshop-${svc}:latest" -f "Dockerfile.${svc}" .
          done
          docker build -t "ghcr.io/${OWNER}/dxshop-front:latest" -f Dockerfile.front .

      - name: Sync compose & deploy assets to /opt/dxshop
        # runner 就在目标机上，直接把仓库里的 compose 与 deploy/ 同步到部署目录（无需 scp）。
        # 前提：/opt/dxshop 已存在且对 runner 运行用户可写（见 deploy/SELF-HOSTED-RUNNER.md 的准备步骤）。
        run: |
          set -e
          mkdir -p /opt/dxshop
          cp -f docker-compose.yml /opt/dxshop/
          rm -rf /opt/dxshop/deploy
          cp -r deploy /opt/dxshop/
          if [ ! -f /opt/dxshop/.env ]; then
            echo "::error::/opt/dxshop/.env 不存在。请先在服务器上 cp .env.example .env 并填写后再部署。"
            exit 1
          fi

      - name: Run via docker compose
        run: |
          set -e
          cd /opt/dxshop
          # 应用镜像 pull_policy 已改为 missing：本机刚 build 好的同名镜像存在，不会去 ghcr 拉取。
          # 注意：compose pull 命令不遵守 pull_policy，必须由 up 触发按策略处理。
          docker compose up -d
          docker image prune -f
          echo "===== 部署后容器状态 ====="
          docker compose ps
