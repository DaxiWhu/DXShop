name: CD

# 触发:CI 工作流在 master 上成功完成后自动跑;也支持手动触发。
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    # 手动触发始终跑;workflow_run 触发时仅当 CI 成功且分支为 master 才跑。
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build all service jars
        run: ./mvnw -B package -DskipTests

      - name: Lowercase registry owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push dxshop-user
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.user
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ env.OWNER }}/dxshop-user:latest
            ghcr.io/${{ env.OWNER }}/dxshop-user:sha-${{ github.sha }}

      - name: Build & push dxshop-order
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.order
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ env.OWNER }}/dxshop-order:latest
            ghcr.io/${{ env.OWNER }}/dxshop-order:sha-${{ github.sha }}

      - name: Build & push dxshop-goods
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.goods
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ env.OWNER }}/dxshop-goods:latest
            ghcr.io/${{ env.OWNER }}/dxshop-goods:sha-${{ github.sha }}

      - name: Build & push dxshop-chat
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.chat
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ env.OWNER }}/dxshop-chat:latest
            ghcr.io/${{ env.OWNER }}/dxshop-chat:sha-${{ github.sha }}
