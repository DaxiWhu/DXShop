name: CD

# 触发:CI 工作流在 master 上成功完成后自动跑;也支持手动触发。
on:
  # 关键：CD 只在 CI 工作流【成功完成】后才自动触发，不会与 CI 并行。
  # workflow_run 的 completed 事件本就在 CI 结束(无论成败)后发出；
  # build-and-push / deploy 的 if 再二次检查 conclusion == 'success'，
  # 因此 CI 没跑完、或跑失败了，CD 都不会真正构建/部署。
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]   # 仅 master 上的 CI 成功才触发，避免 PR/其它分支误触发
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    # 手动触发始终跑;workflow_run 触发时仅当 CI 成功且分支为 master 才跑。
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: 赋予 Maven Wrapper 执行权限
        run: chmod +x ./mvnw

      - name: Build all service jars
        run: ./mvnw -B package -DskipTests

      - name: Lowercase registry owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry (retry)
        run: |
          for i in 1 2 3; do
            if echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin; then
              echo "ghcr.io login ok"; break
            fi
            echo "ghcr.io login attempt $i failed, retrying in 15s..."; sleep 15
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push all images (retry per image)
        # 用 buildx 直接 build --push，逐镜像重试（最多 3 次）以抗 ghcr.io 抖动。
        run: |
          set -e
          PAIRS="user:Dockerfile.user order:Dockerfile.order goods:Dockerfile.goods chat:Dockerfile.chat front:Dockerfile.front"
          for p in $PAIRS; do
            svc="${p%%:*}"; df="${p##*:}"
            for i in 1 2 3; do
              if docker buildx build --push --platform linux/amd64 -f "$df" \
                   -t "ghcr.io/${{ env.OWNER }}/dxshop-$svc:latest" \
                   -t "ghcr.io/${{ env.OWNER }}/dxshop-$svc:sha-${{ github.sha }}" . ; then
                echo "pushed dxshop-$svc"; break
              fi
              echo "push dxshop-$svc attempt $i failed (ghcr.io flaky?), retrying in 20s..."; sleep 20
            done
          done

  deploy:
    name: Deploy on self-hosted runner (内网机器，无需公网 IP)
    needs: build-and-push
    # 与 build-and-push 相同门槛：手动触发始终跑；workflow_run 仅在 CI 成功且 master 时跑。
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'master')
    # 关键：部署 job 跑在【你内网里自建的 self-hosted runner】上。
    # runner 主动出站连 GitHub 拉任务，GitHub 无需反向连你，因此【不需要公网 IP、不需要 SSH Secret】。
    # 前提：目标机已安装 Docker + docker compose 插件，并已注册为带 self-hosted + linux 标签的 runner。
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Log in to GHCR (拉取私有镜像, retry)
        # runner 本机需登录 GHCR 才能 docker compose pull 私有镜像；用工作流自带 GITHUB_TOKEN，无需额外配置。
        run: |
          for i in 1 2 3; do
            if echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin; then
              echo "ghcr.io login ok"; break
            fi
            echo "ghcr.io login attempt $i failed, retrying in 15s..."; sleep 15
          done

      - name: Sync compose & deploy assets to /opt/dxshop
        # runner 就在目标机上，直接把仓库里的 compose 与 deploy/ 同步到部署目录（无需 scp）。
        # 前提：/opt/dxshop 已存在且对 runner 运行用户可写（见 deploy/SELF-HOSTED-RUNNER.md 的准备步骤）。
        run: |
          set -e
          mkdir -p /opt/dxshop
          cp -f docker-compose.yml /opt/dxshop/
          rm -rf /opt/dxshop/deploy
          cp -r deploy /opt/dxshop/
          if [ ! -f /opt/dxshop/.env ]; then
            echo "::error::/opt/dxshop/.env 不存在。请先在服务器上 cp .env.example .env 并填写后再部署。"
            exit 1
          fi

      - name: Run via docker compose (retry on ghcr.io pull)
        run: |
          set -e
          cd /opt/dxshop
          # 中间件镜像 pull_policy: missing（本地已有则跳过），应用镜像 pull_policy: always（每次拉最新）。
          # 注意：compose pull 命令不遵守 pull_policy，必须用 up 触发按策略拉取。
          for i in 1 2 3; do
            if docker compose up -d; then
              echo "deploy ok"; break
            fi
            echo "docker compose up attempt $i failed (likely ghcr.io pull timeout), retrying in 20s..."; sleep 20
          done
          docker image prune -f
          echo "===== 部署后容器状态 ====="
          docker compose ps

      - name: Log out from GHCR
        if: always()
        run: docker logout ghcr.io
