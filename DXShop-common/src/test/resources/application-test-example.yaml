# 测试 Profile 模板（本地连共享开发机中间件模式）
# 用法：复制本文件为同目录下的 application-test.yaml，并按需修改地址/账号/密码。
# application-test.yaml 含真实内网凭据，已被 .gitignore 忽略，请勿入库。
# CI 环境不使用本 profile —— CI 强制 container 模式（application-testcontainers.yaml）。
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://<DB_HOST>:3306/dxshop_test?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: <DB_USER>
    password: <DB_PASSWORD>
  data:
    redis:
      host: <REDIS_HOST>
      port: <REDIS_PORT>
      password: <REDIS_PASSWORD>
      database: 1
  # 关闭注册/配置中心，使上下文可无外网启动
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
    loadbalancer:
      nacos:
        enabled: false
    openfeign:
      enabled: false
  # 排除 RocketMQ 自动配置（避免连 NameServer）
  autoconfigure:
    exclude:
      - org.apache.rocketmq.spring.autoconfigure.RocketMQAutoConfiguration

# Seata 关闭后 @GlobalTransactional 退化为本地事务
seata:
  enabled: false
  enable-auto-data-source-proxy: false

# XXL-JOB 执行器关闭
xxl:
  job:
    executor:
      enabled: false

# RocketMQ 生产端关闭
rocketmq:
  producer:
    enabled: false

# Mapper XML 大小写目录兼容（user/chat 用 Mapper，goods/order 用 mapper）
mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml,classpath*:Mapper/*.xml
