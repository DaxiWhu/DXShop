# 测试 Profile：Docker 真实容器模式（CI 与本地有 Docker 时）
# datasource / redis 由 AbstractIntegrationTest 的 @DynamicPropertySource 运行时注入，不在此写死。
# 仍需要关闭注册/配置中心、Seata、XXL-JOB、RocketMQ，使上下文可无外网启动。
spring:
  # 测试环境不连 Nacos 配置中心：用 optional 声明导入，避免 “No spring.config.import” 启动失败
  config:
    import: optional:nacos:
  data:
    redis:
      # 容器内 Redis 无密码，显式清空以覆盖 main application.yaml 的 123456
      password: ""
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
        # 双保险：显式关闭 import-check 校验（主 application.yaml 的同名配置在测试 profile 下未生效）
        import-check:
          enabled: false
    loadbalancer:
      nacos:
        enabled: false
    openfeign:
      enabled: false
  autoconfigure:
    exclude:
      - org.apache.rocketmq.spring.autoconfigure.RocketMQAutoConfiguration

seata:
  enabled: false
  enable-auto-data-source-proxy: false

# 阿里云 OSS：测试用占位符。OssUtil 在集成测试中由 @MockBean 隔离，不会真实调用；
# 但 Spring 建上下文时需先实例化 ossClient bean，故必须提供非空（任意）值，
# 否则 OssConfig 抛 InvalidCredentialsException: Access key id should not be null or empty。
aliyun:
  oss:
    region: cn-hangzhou
    endpoint: oss-cn-hangzhou.aliyuncs.com
    bucket-name: dxshop-test
    access-key-id: test-access-key-id
    access-key-secret: test-access-key-secret
    role-arn: ""
    expire-time: 300
    temp-url-expire: 300
    allow-suffix: .jpg,.png
    max-size: 10485760

xxl:
  job:
    executor:
      enabled: false

rocketmq:
  producer:
    enabled: false

# 注意：mybatis-plus.mapper-locations 不再在此重复设置。
# 各模块主 application.yaml 已统一为 classpath:mapper/*.xml（user/chat 的 Mapper 目录已重命名为 mapper）。
# Spring 对 mybatis-plus.mapper-locations 为“合并”语义，若此处再写一遍会与主配置叠加，
# 导致同一 Mapper XML 被扫描两遍，触发 MyBatis “Result Maps collection already contains value”而上下文加载失败。
