# DXShop 前端 nginx 配置
# 镜像由 Dockerfile.front 放入 /etc/nginx/conf.d/default.conf
# 反代目标使用 docker-compose 服务名（dxshop-user/order/goods/chat），
# 与 DXShop-Front/vite.config.ts 的 dev proxy 规则一一对应。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 公共反代头（被各 location 的 proxy_pass 继承）
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # SPA 前端路由：未知路径回退到 index.html（react-router 用）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- WebSocket（客服 / 聊天）----
    location /ws {
        proxy_pass http://dxshop-chat:8085;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ---- 用户模块（含 OSS） -> 8082 ----
    location /api/user {
        proxy_pass http://dxshop-user:8082;
    }
    location /api/oss {
        proxy_pass http://dxshop-user:8082;
    }

    # ---- 订单模块（含 MQ） -> 8083 ----
    location /api/order {
        proxy_pass http://dxshop-order:8083;
    }
    location /api/mq {
        proxy_pass http://dxshop-order:8083;
    }

    # ---- 商品模块 -> 8084 ----
    location /api/goods {
        proxy_pass http://dxshop-goods:8084;
    }

    # ---- 聊天 / 客服模块 -> 8085 ----
    location /api/chat {
        proxy_pass http://dxshop-chat:8085;
    }
    location /api/cs {
        proxy_pass http://dxshop-chat:8085;
    }
}
