# DXShop 单台 Linux 部署编排
#
# 用法（在目标服务器上）:
#   1) 建目录:  mkdir -p /opt/dxshop
#   2) 把本文件放到 /opt/dxshop/docker-compose.yml
#   3) 复制 .env.example 为 /opt/dxshop/.env 并填入真实值（CI 会自动 scp 更新本文件）
#   4) 首次启动:  cd /opt/dxshop && docker compose up -d
#
# 说明:
#   - 应用配置完全由环境变量驱动（CI 构建的 jar 不含 application.yaml）。
#   - 原开发配置写死 172.17.156.101，这里统一改为 compose 服务名
#     (mysql / redis / nacos / seata / rocketmq-namesrv)，由 Docker 内部 DNS 解析。
#   - 敏感值（密码、OSS 密钥）用 ${...} 从同目录 .env 读取，绝不入库。
#   - 镜像来自 GHCR:  ghcr.io/<REGISTRY_OWNER>/dxshop-*:latest
#   - 镜像拉取策略: 中间件(mysql/redis/nacos/seata/rocketmq)设 pull_policy: missing(本地已有同 tag 镜像则跳过拉取,避免重复部署反复拉大镜像碰国内网络 EOF); 4 个应用镜像设 pull_policy: always(每次拉最新构建)。部署用 docker compose up -d(而非 compose pull),由 up 按各服务策略拉取。

services:
  mysql:
    image: mysql:8.0
    pull_policy: missing
    container_name: dxshop-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: dxshop
      TZ: Asia/Shanghai
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      # 宿主机 WSL 上已有自启 MySQL 占用 3306，这里改用 13306 避免端口冲突。
      # 应用容器走 Docker 内网 mysql:3306 连接，不受此宿主机映射影响。
      - "13306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次初始化时自动建 seata 库+事务表、业务库 undo_log（仅数据卷为空时执行）
      - ./deploy/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-123456}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  redis:
    image: redis:7.2
    pull_policy: missing
    container_name: dxshop-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-123456}", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-123456}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  nacos:
    image: nacos/nacos-server:v2.3.2
    pull_policy: missing
    container_name: dxshop-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      NACOS_AUTH_IDENTITY_KEY: nacos
      NACOS_AUTH_IDENTITY_VALUE: nacos
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:-changeMeNacosToken}
    ports:
      - "8848:8848"
      - "9848:9848"
    volumes:
      - nacos-data:/home/nacos/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 30
      # WSL 等资源受限环境下 Nacos(Java)启动慢，给足宽限期，期间失败不计入重试次数
      start_period: 180s

  # 一次性任务：把 Seata 统一配置发布到 Nacos（dataId=seataServer.properties, group=SEATA_GROUP）
  # 成功退出后，seata 与各应用才启动，确保它们能从 Nacos 读到配置。
  seata-nacos-config:
    image: curlimages/curl:8.10.1
    pull_policy: missing
    container_name: dxshop-seata-nacos-config
    restart: "no"
    environment:
      NACOS_ADDR: nacos:8848
      NACOS_USER: nacos
      NACOS_PASSWORD: nacos
      SEATA_GROUP: SEATA_GROUP
      SEATA_DATA_ID: seataServer.properties
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
    volumes:
      - ./deploy/seata:/seata:ro
    entrypoint: ["sh", "/seata/push-config.sh"]
    depends_on:
      nacos:
        condition: service_healthy

  seata:
    image: seataio/seata-server:2.0.0
    pull_policy: missing
    container_name: dxshop-seata
    restart: unless-stopped
    environment:
      SEATA_CONFIG_TYPE: nacos
      SEATA_CONFIG_NACOS_SERVER_ADDR: nacos:8848
      SEATA_CONFIG_NACOS_GROUP: SEATA_GROUP
      SEATA_CONFIG_NACOS_DATA_ID: seataServer.properties
      SEATA_CONFIG_NACOS_USERNAME: nacos
      SEATA_CONFIG_NACOS_PASSWORD: nacos
      SEATA_REGISTRY_TYPE: nacos
      SEATA_REGISTRY_NACOS_SERVER_ADDR: nacos:8848
      SEATA_REGISTRY_NACOS_USERNAME: nacos
      SEATA_REGISTRY_NACOS_PASSWORD: nacos
      SEATA_REGISTRY_NACOS_GROUP: SEATA_GROUP
      SEATA_REGISTRY_NACOS_APPLICATION: seata-server
    ports:
      - "8091:8091"
      - "7091:7091"
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
      seata-nacos-config:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8091/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  rocketmq-namesrv:
    image: apache/rocketmq:4.9.7
    pull_policy: missing
    container_name: dxshop-rocketmq-namesrv
    restart: unless-stopped
    command: ["sh", "mqnamesrv"]
    ports:
      - "9876:9876"
    volumes:
      - rocketmq-data:/home/rocketmq/logs

  rocketmq-broker:
    image: apache/rocketmq:4.9.7
    pull_policy: missing
    container_name: dxshop-rocketmq-broker
    restart: unless-stopped
    command: ["sh", "mqbroker", "-n", "rocketmq-namesrv:9876", "autoCreateTopicEnable=true"]
    ports:
      - "10909:10909"
      - "10911:10911"
    volumes:
      - rocketmq-data:/home/rocketmq/logs
    depends_on:
      rocketmq-namesrv:
        condition: service_started

  dxshop-user:
    image: ghcr.io/${REGISTRY_OWNER:?set REGISTRY_OWNER in .env}/dxshop-user:latest
    pull_policy: always
    container_name: dxshop-user
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/dxshop?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-123456}
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_USERNAME: nacos
      SPRING_CLOUD_NACOS_PASSWORD: nacos
      SEATA_ENABLED: "true"
      SEATA_REGISTRY_TYPE: nacos
      SEATA_REGISTRY_NACOS_SERVER_ADDR: nacos:8848
      SEATA_REGISTRY_NACOS_USERNAME: nacos
      SEATA_REGISTRY_NACOS_PASSWORD: nacos
      SEATA_REGISTRY_NACOS_GROUP: SEATA_GROUP
      SEATA_REGISTRY_NACOS_APPLICATION: seata-server
      SEATA_CONFIG_TYPE: nacos
      SEATA_CONFIG_NACOS_SERVER_ADDR: nacos:8848
      SEATA_CONFIG_NACOS_GROUP: SEATA_GROUP
      SEATA_CONFIG_NACOS_DATA_ID: seataServer.properties
      SEATA_CONFIG_NACOS_USERNAME: nacos
      SEATA_CONFIG_NACOS_PASSWORD: nacos
      SEATA_TX_SERVICE_GROUP: my_test_tx_group
      SEATA_SERVICE_VGROUP_MAPPING_MY_TEST_TX_GROUP: default
      ALIYUN_OSS_ENDPOINT: ${ALIYUN_OSS_ENDPOINT:-oss-cn-wuhan-lr.aliyuncs.com}
      ALIYUN_OSS_BUCKET_NAME: ${ALIYUN_OSS_BUCKET_NAME:-daxi-shop}
      ALIYUN_OSS_ACCESS_KEY_ID: ${ALIYUN_OSS_ACCESS_KEY_ID}
      ALIYUN_OSS_ACCESS_KEY_SECRET: ${ALIYUN_OSS_ACCESS_KEY_SECRET}
      ALIYUN_OSS_ROLE_ARN: ${ALIYUN_OSS_ROLE_ARN}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      seata:
        condition: service_healthy

  dxshop-order:
    image: ghcr.io/${REGISTRY_OWNER:?set REGISTRY_OWNER in .env}/dxshop-order:latest
    pull_policy: always
    container_name: dxshop-order
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/dxshop?useSSL=false&rewriteBatchedStatements=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_USERNAME: nacos
      SPRING_CLOUD_NACOS_PASSWORD: nacos
      SEATA_ENABLED: "true"
      SEATA_REGISTRY_TYPE: nacos
      SEATA_REGISTRY_NACOS_SERVER_ADDR: nacos:8848
      SEATA_REGISTRY_NACOS_USERNAME: nacos
      SEATA_REGISTRY_NACOS_PASSWORD: nacos
      SEATA_REGISTRY_NACOS_GROUP: SEATA_GROUP
      SEATA_REGISTRY_NACOS_APPLICATION: seata-server
      SEATA_CONFIG_TYPE: nacos
      SEATA_CONFIG_NACOS_SERVER_ADDR: nacos:8848
      SEATA_CONFIG_NACOS_GROUP: SEATA_GROUP
      SEATA_CONFIG_NACOS_DATA_ID: seataServer.properties
      SEATA_CONFIG_NACOS_USERNAME: nacos
      SEATA_CONFIG_NACOS_PASSWORD: nacos
      SEATA_TX_SERVICE_GROUP: my_test_tx_group
      SEATA_SERVICE_VGROUP_MAPPING_MY_TEST_TX_GROUP: default
      ROCKETMQ_NAME_SERVER: rocketmq-namesrv:9876
      ALIYUN_OSS_ENDPOINT: ${ALIYUN_OSS_ENDPOINT:-oss-cn-wuhan-lr.aliyuncs.com}
      ALIYUN_OSS_BUCKET_NAME: ${ALIYUN_OSS_BUCKET_NAME:-daxi-shop}
      ALIYUN_OSS_ACCESS_KEY_ID: ${ALIYUN_OSS_ACCESS_KEY_ID}
      ALIYUN_OSS_ACCESS_KEY_SECRET: ${ALIYUN_OSS_ACCESS_KEY_SECRET}
      ALIYUN_OSS_ROLE_ARN: ${ALIYUN_OSS_ROLE_ARN}
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
      seata:
        condition: service_healthy
      rocketmq-broker:
        condition: service_started

  dxshop-goods:
    image: ghcr.io/${REGISTRY_OWNER:?set REGISTRY_OWNER in .env}/dxshop-goods:latest
    pull_policy: always
    container_name: dxshop-goods
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/dxshop?useSSL=false&rewriteBatchedStatements=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-123456}
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_USERNAME: nacos
      SPRING_CLOUD_NACOS_PASSWORD: nacos
      SEATA_ENABLED: "true"
      SEATA_REGISTRY_TYPE: nacos
      SEATA_REGISTRY_NACOS_SERVER_ADDR: nacos:8848
      SEATA_REGISTRY_NACOS_USERNAME: nacos
      SEATA_REGISTRY_NACOS_PASSWORD: nacos
      SEATA_REGISTRY_NACOS_GROUP: SEATA_GROUP
      SEATA_REGISTRY_NACOS_APPLICATION: seata-server
      SEATA_CONFIG_TYPE: nacos
      SEATA_CONFIG_NACOS_SERVER_ADDR: nacos:8848
      SEATA_CONFIG_NACOS_GROUP: SEATA_GROUP
      SEATA_CONFIG_NACOS_DATA_ID: seataServer.properties
      SEATA_CONFIG_NACOS_USERNAME: nacos
      SEATA_CONFIG_NACOS_PASSWORD: nacos
      SEATA_TX_SERVICE_GROUP: my_test_tx_group
      SEATA_SERVICE_VGROUP_MAPPING_MY_TEST_TX_GROUP: default
      ALIYUN_OSS_ENDPOINT: ${ALIYUN_OSS_ENDPOINT:-oss-cn-wuhan-lr.aliyuncs.com}
      ALIYUN_OSS_BUCKET_NAME: ${ALIYUN_OSS_BUCKET_NAME:-daxi-shop}
      ALIYUN_OSS_ACCESS_KEY_ID: ${ALIYUN_OSS_ACCESS_KEY_ID}
      ALIYUN_OSS_ACCESS_KEY_SECRET: ${ALIYUN_OSS_ACCESS_KEY_SECRET}
      ALIYUN_OSS_ROLE_ARN: ${ALIYUN_OSS_ROLE_ARN}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      seata:
        condition: service_healthy

  dxshop-chat:
    image: ghcr.io/${REGISTRY_OWNER:?set REGISTRY_OWNER in .env}/dxshop-chat:latest
    pull_policy: always
    container_name: dxshop-chat
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/dxshop?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-123456}
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_USERNAME: nacos
      SPRING_CLOUD_NACOS_PASSWORD: nacos
      SEATA_ENABLED: "true"
      SEATA_REGISTRY_TYPE: nacos
      SEATA_REGISTRY_NACOS_SERVER_ADDR: nacos:8848
      SEATA_REGISTRY_NACOS_USERNAME: nacos
      SEATA_REGISTRY_NACOS_PASSWORD: nacos
      SEATA_REGISTRY_NACOS_GROUP: SEATA_GROUP
      SEATA_REGISTRY_NACOS_APPLICATION: seata-server
      SEATA_CONFIG_TYPE: nacos
      SEATA_CONFIG_NACOS_SERVER_ADDR: nacos:8848
      SEATA_CONFIG_NACOS_GROUP: SEATA_GROUP
      SEATA_CONFIG_NACOS_DATA_ID: seataServer.properties
      SEATA_CONFIG_NACOS_USERNAME: nacos
      SEATA_CONFIG_NACOS_PASSWORD: nacos
      SEATA_TX_SERVICE_GROUP: my_test_tx_group
      SEATA_SERVICE_VGROUP_MAPPING_MY_TEST_TX_GROUP: default
      ALIYUN_OSS_ENDPOINT: ${ALIYUN_OSS_ENDPOINT:-oss-cn-wuhan-lr.aliyuncs.com}
      ALIYUN_OSS_BUCKET_NAME: ${ALIYUN_OSS_BUCKET_NAME:-daxi-shop}
      ALIYUN_OSS_ACCESS_KEY_ID: ${ALIYUN_OSS_ACCESS_KEY_ID}
      ALIYUN_OSS_ACCESS_KEY_SECRET: ${ALIYUN_OSS_ACCESS_KEY_SECRET}
      ALIYUN_OSS_ROLE_ARN: ${ALIYUN_OSS_ROLE_ARN}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      seata:
        condition: service_healthy

volumes:
  mysql-data:
  redis-data:
  nacos-data:
  rocketmq-data:
